<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Thank You | AYU SAFA CARE</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef3ee;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.box {
    background: white;
    max-width: 550px;
    width: 90%;
    padding: 45px 25px;
    text-align: center;
    border-radius: 20px;
    box-shadow: 0 10px 35px rgba(0,0,0,.12);
}

.check {
    font-size: 60px;
}

h1 {
    color: #123b2a;
}

.details {
    background: #f5f5f5;
    padding: 20px;
    border-radius: 12px;
    text-align: left;
    line-height: 1.8;
    margin-top: 20px;
}

.whatsapp {
    display: inline-block;
    margin-top: 25px;
    padding: 14px 25px;
    background: #25D366;
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-weight: bold;
}

.home {
    display: inline-block;
    margin-top: 15px;
    color: #123b2a;
    text-decoration: none;
}

</style>

</head>

<body>

<div class="box">

<div class="check">✓</div>

<h1>THANK YOU!</h1>

<p>
YOUR ORDER HAS BEEN RECEIVED.
</p>

<div class="details">

<strong>NAME:</strong> {{ name }}<br>

<strong>PRODUCT:</strong> {{ product }}<br>

<strong>QUANTITY:</strong> {{ quantity }}<br>

<strong>TOTAL:</strong> ₹{{ total }}<br>

<strong>PAYMENT:</strong> CASH ON DELIVERY<br>

<strong>MOBILE:</strong> {{ phone }}<br>

<strong>ADDRESS:</strong> {{ address }}

</div>

<a
class="whatsapp"
target="_blank"
href="https://wa.me/916355074854?text=NEW%20COD%20ORDER%20-%20NAME:%20{{ name }}%20-%20PRODUCT:%20{{ product }}%20-%20QTY:%20{{ quantity }}%20-%20TOTAL:%20₹{{ total }}%20-%20PHONE:%20{{ phone }}%20-%20ADDRESS:%20{{ address }}"
>
SEND ORDER ON WHATSAPP
</a>

<br>

<a class="home" href="/">
← BACK TO AYU SAFA CARE
</a>

</div>

</body>

</html>
