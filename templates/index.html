<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AYU SAFA CARE | HERBAL WELLNESS</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        /* PRODUCT IMAGE SIZE */

        .product-image {
            width: 100%;
            height: 180px !important;
            padding: 10px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #f7f7f4;
            box-sizing: border-box;
        }

        .product-image img {
            width: auto !important;
            height: auto !important;
            max-width: 135px !important;
            max-height: 155px !important;
            object-fit: contain !important;
            display: block;
        }


        /* PRODUCT DETAILS MODAL */

        .product-modal {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.72);
        }

        .product-modal.show {
            display: flex;
        }

        .product-modal-box {
            position: relative;
            width: 100%;
            max-width: 850px;
            max-height: 90vh;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #ffffff;
            border-radius: 22px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.30);
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 10;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: #123d2d;
            color: white;
            font-size: 27px;
            line-height: 40px;
            cursor: pointer;
        }

        .modal-close:hover {
            background: #1d6045;
        }

        .modal-image {
            min-height: 430px;
            padding: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f7f4;
        }
