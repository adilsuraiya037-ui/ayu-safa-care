<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AYU SAFA CARE | HERBAL WELLNESS</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        /* =========================================
           PRODUCT GRID
        ========================================= */

        .product-grid {
            align-items: stretch;
        }

        .product-card {
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .product-image {
            width: 100%;
            height: 180px;
            padding: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background: #f7f7f4;
            box-sizing: border-box;
        }

        .product-image img {
            width: auto;
            height: auto;

            max-width: 135px;
            max-height: 155px;

            object-fit: contain;
            display: block;
        }

        .product-content {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-content .price {
            margin-top: auto;
        }


        /* =========================================
           PRODUCT BUTTONS
        ========================================= */

        .product-content .card-button {
            width: 100%;
            min-height: 46px;

            margin-top: 8px;

            border: none;
            border-radius: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            box-sizing: border-box;

            cursor: pointer;

            font-family: inherit;
        }

        .product-content button.card-button {
            background: #123d2d;
            color: #ffffff;

            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .product-content button.card-button:hover {
            background: #1e5b42;
        }

        .product-content .secondary-button {
            background: #f0eadc;
            color: #123d2d;

            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .product-content .secondary-button:hover {
            background: #e3dbc9;
        }


        /* =========================================
           PRODUCT DETAILS MODAL
        ========================================= */

        .product-modal {
            position: fixed;
            inset: 0;

            z-index: 99999;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 15px;

            background: rgba(0, 0, 0, 0.72);
        }

        .product-modal.show {
            display: flex;
        }

        .product-modal-box {
            position: relative;

            width: 100%;
            max-width: 850px;
            max-height: 90vh;

            overflow-y: auto;

            display: grid;
            grid-template-columns: 1fr 1fr;

            background: #ffffff;

            border-radius: 22px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.30);
        }

        .modal-close {
            position: absolute;

            top: 12px;
            right: 12px;

            z-index: 10;

            width: 40px;
            height: 40px;

            border: none;
            border-radius: 50%;

            background: #123d2d;
            color: #ffffff;

            font-size: 27px;
            line-height: 40px;

            cursor: pointer;
        }

        .modal-close:hover {
            background: #1e5b42;
        }

        .modal-image {
            min-height: 430px;

            padding: 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f7f7f4;
        }

        .modal-image img {
            width: auto;
            height: auto;

            max-width: 300px;
            max-height: 360px;

            object-fit: contain;
        }

        .modal-content {
            padding: 55px 35px 35px;
        }

        .modal-content h2 {
