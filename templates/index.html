        }

            width: 100%;
            height: 180px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background: #f7f7f4;
            box-sizing: border-box;
        }

        .product-image img {
            width: auto;
            height: auto;

            max-width: 135px;
            max-height: 155px;

            object-fit: contain;
            display: block;
        }

        .product-content {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-content .price {
            margin-top: auto;
        }


        /* =========================================
           PRODUCT BUTTONS
        ========================================= */

        .product-content .card-button {
            width: 100%;
            min-height: 46px;

            margin-top: 8px;

            border: none;
            border-radius: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            box-sizing: border-box;

            cursor: pointer;
        }

        .product-content button.card-button {
            background: #123d2d;
            color: #ffffff;

            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .product-content button.card-button:hover {
            background: #1e5b42;
        }

        .product-content .secondary-button {
            background: #f0eadc;
            color: #123d2d;

            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .product-content .secondary-button:hover {

        }


        /* =========================================
           NAVBAR ACTIONS
        ========================================= */

        .nav-actions {
            display: flex;

        }

        .track-nav-button {

            align-items: center;

            color: #123d2d;

            text-decoration: none;

            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1px;

            transition: 0.3s ease;
        }

        .track-nav-button:hover {
            background: #123d2d;
            color: #ffffff;
        }

           PRODUCT DETAILS MODAL
