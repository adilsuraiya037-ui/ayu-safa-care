<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AYU SAFA CARE | HERBAL WELLNESS</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        /* =========================================
           PRODUCT GRID
        ========================================= */

        .product-grid {
            align-items: stretch;
        }

        .product-card {
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .product-image {
            width: 100%;
            height: 180px;
            padding: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background: #f7f7f4;
            box-sizing: border-box;
        }

        .product-image img {
            width: auto;
            height: auto;

            max-width: 135px;
            max-height: 155px;

            object-fit: contain;
            display: block;
        }

        .product-content {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-content .price {
            margin-top: auto;
        }


        /* =========================================
           PRODUCT BUTTONS
        ========================================= */

        .product-content .card-button {
            width: 100%;
            min-height: 46px;

            margin-top: 8px;

            border: none;
            border-radius: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            box-sizing: border-box;

            cursor: pointer;
        }

        .product-content button.card-button {
            background: #123d2d;
            color: #ffffff;

            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .product-content button.card-button:hover {
            background: #1e5b42;
        }

        .product-content .secondary-button {
            background: #f0eadc;
            color: #123d2d;

            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .product-content .secondary-button:hover {
            background: #e3dbc9;
        }


        /* =========================================
           PRODUCT DETAILS MODAL
        ========================================= */

        .product-modal {
            position: fixed;
            inset: 0;

            z-index: 99999;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 15px;

            background: rgba(0, 0, 0, 0.72);
        }

        .product-modal.show {
            display: flex;
        }

        .product-modal-box {
            position: relative;

            width: 100%;
            max-width: 850px;
            max-height: 90vh;

            overflow-y: auto;

            display: grid;
            grid-template-columns: 1fr 1fr;

            background: #ffffff;

            border-radius: 22px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.30);
        }

        .modal-close {
            position: absolute;

            top: 12px;
            right: 12px;

            z-index: 10;

            width: 40px;
            height: 40px;

            border: none;
            border-radius: 50%;

            background: #123d2d;
            color: #ffffff;

            font-size: 27px;
            line-height: 40px;

            cursor: pointer;
        }

        .modal-close:hover {
            background: #1e5b42;
        }

        .modal-image {
            min-height: 430px;

            padding: 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f7f7f4;
        }

        .modal-image img {
            width: auto;
            height: auto;

            max-width: 300px;
            max-height: 360px;

            object-fit: contain;
        }

        .modal-content {
            padding: 55px 35px 35px;
        }

        .modal-content h2 {
            margin: 5px 0 15px;

            color: #123d2d;

            font-size: 29px;
            line-height: 1.25;
        }

        .modal-content .price {
            margin-bottom: 20px;

            color: #123d2d;

            font-size: 24px;
            font-weight: 900;
        }

        .modal-content p {
            color: #68756f;

            font-size: 14px;
            line-height: 1.7;

            margin-bottom: 22px;
        }

        .modal-content h4 {
            color: #123d2d;

            font-size: 12px;
            letter-spacing: 1.5px;

            margin-bottom: 12px;
        }

        .modal-content ul {
            padding-left: 20px;
            margin-bottom: 25px;
        }

        .modal-content li {
            color: #52645c;

            font-size: 13px;
            line-height: 1.6;

            margin-bottom: 7px;
        }

        .modal-order-button {
            width: 100%;
            min-height: 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 28px;

            background: #123d2d;
            color: #ffffff;

            text-decoration: none;

            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .modal-order-button:hover {
            background: #1e5b42;
        }


        /* =========================================
           MULTI PRODUCT ORDER SECTION
        ========================================= */

        .order-products {
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .order-products-title {
            display: block;

            margin-bottom: 12px;

            color: #123d2d;

            font-size: 13px;
            font-weight: 900;

            letter-spacing: 1px;
        }

        .order-product-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 12px;

            margin-bottom: 10px;
            padding: 14px 15px;

            background: #f7f7f4;

            border: 1px solid #e3e3dc;
            border-radius: 14px;
        }

        .order-product-info {
            flex: 1;
            min-width: 0;
        }

        .order-product-name {
            display: block;

            color: #123d2d;

            font-size: 13px;
            font-weight: 900;

            line-height: 1.4;
        }

        .order-product-price {
            display: block;

            margin-top: 3px;

            color: #68756f;

            font-size: 12px;
        }

        .order-quantity {
            width: 75px !important;
            min-width: 75px;

            margin: 0 !important;

            padding: 10px !important;

            text-align: center;

            border-radius: 10px !important;
        }


        /* =========================================
           ORDER SUMMARY
        ========================================= */

        .order-summary {
            margin-top: 18px;
            margin-bottom: 18px;

            padding: 16px 18px;

            background: #ffffff;

            border: 1px solid #e3e3dc;

            border-radius: 14px;
        }

        .summary-title {
            margin-bottom: 10px;

            color: #123d2d;

            font-size: 12px;
            font-weight: 900;

            letter-spacing: 1px;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 6px;

            color: #52645c;

            font-size: 13px;
        }

        .summary-line strong {
            color: #123d2d;
        }


        /* =========================================
           TOTAL
        ========================================= */

        .total-box {
            margin-top: 20px;
            margin-bottom: 18px;

            padding: 18px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #f7f7f4;

            border: 1px solid #e3e3dc;
            border-radius: 14px;
        }

        .total-box span {
            color: #52645c;

            font-size: 13px;
            font-weight: 800;

            letter-spacing: 1px;
        }

        .total-box strong {
            color: #123d2d;

            font-size: 24px;
            font-weight: 900;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .product-image {
                height: 155px;
            }

            .product-image img {
                max-width: 110px;
                max-height: 130px;
            }

            .product-modal {
                padding: 10px;
            }

            .product-modal-box {
                grid-template-columns: 1fr;

                max-height: 94vh;

                border-radius: 18px;
            }

            .modal-image {
                min-height: 250px;
                padding: 20px;
            }

            .modal-image img {
                max-width: 220px;
                max-height: 230px;
            }

            .modal-content {
                padding: 28px 22px 25px;
            }

            .modal-content h2 {
                font-size: 24px;
            }

            .order-product-row {
                padding: 12px;
            }

            .order-product-name {
                font-size: 12px;
            }

            .order-product-price {
                font-size: 11px;
            }

            .order-quantity {
                width: 65px !important;
                min-width: 65px;
            }

            .total-box strong {
                font-size: 21px;
            }

        }

    </style>

</head>


<body>
