<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ORDER CONFIRMED | AYU SAFA CARE</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="navbar">

    <div class="brand">

        <div class="brand-mark">
            AS
        </div>

        <div>
            <h1>AYU SAFA CARE</h1>
            <span>HERBAL WELLNESS</span>
        </div>

    </div>

</header>


<section class="order-section">

    <div class="order-box"
         style="text-align:center;">

        <div style="
            width:80px;
            height:80px;
            margin:0 auto 25px;
            border-radius:50%;
            background:#edf3ed;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:40px;
        ">
            ✓
        </div>


        <div class="section-heading">

            <p>AYU SAFA CARE</p>

            <h2>
                ORDER RECEIVED
            </h2>

            <span>
                THANK YOU FOR YOUR ORDER
            </span>

        </div>


        <p style="
            margin-bottom:15px;
            color:#68756f;
        ">
            Dear {{ customer_name }},
        </p>


        <p style="
            margin-bottom:25px;
            color:#68756f;
        ">
            Your order has been successfully placed.
        </p>


        <div class="total-box">

            <span>
                ORDER ID
            </span>

            <strong style="font-size:18px;">
                {{ order_id }}
            </strong>

        </div>


        <a href="{{ url_for('index') }}"
           class="primary-button">

            CONTINUE SHOPPING

        </a>

    </div>

</section>


<footer>

    <h3>
        AYU SAFA CARE
    </h3>

    <p>
        HERBAL CARE • EVERYDAY WELLNESS
    </p>

</footer>

</body>
</html>
