<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#123d2d">

    <title>
        ADMIN DASHBOARD | AYU SAFA CARE
    </title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f6f2;

            color: #24352d;

            min-height: 100vh;

            line-height: 1.5;
        }


        button,
        input,
        select {
            font-family: inherit;
        }


        /* =====================================================
           TOP BAR
        ===================================================== */

        .admin-header {

            width: 100%;

            min-height: 76px;

            padding: 12px 5%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            background: #ffffff;

            border-bottom:
                1px solid #e0e6df;

            position: sticky;

            top: 0;

            z-index: 1000;

            box-shadow:
                0 3px 15px
                rgba(18,61,45,0.05);
        }


        /* =====================================================
           BRAND
        ===================================================== */

        .admin-brand {

            display: flex;

            align-items: center;

            gap: 12px;

            min-width: 0;
        }


        .brand-logo {

            width: 48px;

            height: 48px;

            flex: 0 0 48px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            background: #123d2d;

            color: #ffffff;

            font-size: 7px;

            font-weight: 900;

            line-height: 1.2;

            letter-spacing: 0.3px;
        }


        .brand-info h1 {

            color: #123d2d;

            font-size: 18px;

            font-weight: 900;

            letter-spacing: 1.8px;

            line-height: 1.2;
        }


        .brand-info p {

            margin-top: 3px;

            color: #78847e;

            font-size: 8px;

            font-weight: 800;

            letter-spacing: 1.5px;
        }


        /* =====================================================
           HEADER ACTIONS
        ===================================================== */

        .header-actions {

            display: flex;

            align-items: center;

            gap: 8px;
        }


        .website-button,
        .logout-button {

            min-height: 40px;

            padding: 0 16px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            border-radius: 22px;

            text-decoration: none;

            font-size: 10px;

            font-weight: 900;

            letter-spacing: 0.8px;

            transition:
                0.2s ease;
        }


        .website-button {

            background: #f0eadc;

            color: #123d2d;

            border:
                1px solid #ded6c5;
        }


        .website-button:hover {

            background: #123d2d;

            color: #ffffff;
        }


        .logout-button {

            background: #123d2d;

            color: #ffffff;

            border:
                1px solid #123d2d;
        }


        .logout-button:hover {

            background: #1e5b42;

            transform:
                translateY(-1px);
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .dashboard {

            width: 100%;

            max-width: 1450px;

            margin: 0 auto;

            padding: 38px 5% 60px;
        }


        /* =====================================================
           PAGE TITLE
        ===================================================== */

        .page-heading {

            margin-bottom: 28px;
        }


        .page-heading .small {

            margin-bottom: 5px;

            color: #6d806f;

            font-size: 9px;

            font-weight: 900;

            letter-spacing: 2.5px;
        }


        .page-heading h2 {

            color: #123d2d;

            font-size: 32px;

            font-weight: 900;

            line-height: 1.2;
        }


        .page-heading p {

            margin-top: 7px;

            color: #78847e;

            font-size: 12px;
        }


        /* =====================================================
           STAT CARDS
        ===================================================== */

        .stats-grid {

            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(6, minmax(0, 1fr));

            gap: 14px;

            margin-bottom: 30px;
        }


        .stat-card {

            min-width: 0;

            padding: 20px 18px;

            background: #ffffff;

            border:
                1px solid #e0e6df;

            border-radius: 16px;

            box-shadow:
                0 7px 25px
                rgba(18,61,45,0.05);
        }


        .stat-label {

            color: #78847e;

            font-size: 9px;

            font-weight: 900;

            letter-spacing: 1.2px;
        }


        .stat-number {

            margin-top: 7px;

            color: #123d2d;

            font-size: 27px;

            font-weight: 900;

            line-height: 1.1;
        }


        .stat-card.new {

            border-top:
                4px solid #123d2d;
        }


        .stat-card.confirmed {

            border-top:
                4px solid #527260;
        }


        .stat-card.shipped {

            border-top:
                4px solid #718878;
        }


        .stat-card.delivered {

            border-top:
                4px solid #3f7658;
        }


        .stat-card.cancelled {

            border-top:
                4px solid #9b6b60;
        }


        .stat-card.total {

            border-top:
                4px solid #24352d;
        }


        /* =====================================================
           ORDERS PANEL
        ===================================================== */

        .orders-panel {

            background: #ffffff;

            border:
                1px solid #e0e6df;

            border-radius: 20px;

            box-shadow:
                0 10px 35px
                rgba(18,61,45,0.06);

            overflow: hidden;
        }


        /* =====================================================
           PANEL HEADER
        ===================================================== */

        .panel-header {

            padding: 22px 24px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            border-bottom:
                1px solid #e7ebe5;
        }


        .panel-title h3 {

            color: #123d2d;

            font-size: 18px;

            font-weight: 900;
        }


        .panel-title p {

            margin-top: 3px;

            color: #849089;

            font-size: 10px;
        }


        /* =====================================================
           SEARCH + FILTER
        ===================================================== */

        .filters {

            display: flex;

            align-items: center;

            gap: 8px;
        }


        .search-input,
        .status-filter {

            height: 40px;

            border:
                1px solid #d9dfda;

            border-radius: 10px;

            background: #fbfcfa;

            color: #24352d;

            outline: none;

            font-size: 11px;
        }


        .search-input {

            width: 230px;

            padding: 0 13px;
        }


        .status-filter {

            padding: 0 12px;

            cursor: pointer;
        }


        .search-input:focus,
        .status-filter:focus {

            border-color: #527260;

            box-shadow:
                0 0 0 3px
                rgba(82,114,96,0.10);
        }


        /* =====================================================
           TABLE
        ===================================================== */

        .table-wrapper {

            width: 100%;

            overflow-x: auto;
        }


        .orders-table {

            width: 100%;

            min-width: 1050px;

            border-collapse: collapse;
        }


        .orders-table th {

            padding: 13px 15px;

            text-align: left;

            background: #f7f8f5;

            color: #65736b;

            border-bottom:
                1px solid #e1e6e0;

            font-size: 9px;

            font-weight: 900;

            letter-spacing: 1px;

            white-space: nowrap;
```
